 name: Avisos Boca

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar novedades
        run: python Avisos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar lo ya visto
        run: |
          git config user.name "avisos-bot"
          git config user.email "avisos-bot@users.noreply.github.com"
          git add vistos.json
          git commit -m "Actualizar vistos" || true
          git push
